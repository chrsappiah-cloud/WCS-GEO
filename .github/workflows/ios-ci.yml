name: iOS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WCS-GEO.xcodeproj \
            -scheme WCS-GEO

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project WCS-GEO.xcodeproj \
            -scheme WCS-GEO \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WCS-GEO.xcodeproj \
            -scheme WCS-GEO

      - name: Run unit tests
        run: |
          set -euo pipefail
          # Pick first available iPhone simulator (GitHub runner images vary)
          DESTINATION=$(xcodebuild -showdestinations -project WCS-GEO.xcodeproj -scheme WCS-GEO 2>/dev/null \
            | grep "platform:iOS Simulator" | grep "iPhone" | head -1 \
            | sed -n 's/.*id:\([^,]*\).*/platform=iOS Simulator,id=\1/p')
          if [ -z "$DESTINATION" ]; then
            DESTINATION='generic/platform=iOS Simulator'
          fi
          echo "Using destination: $DESTINATION"
          xcodebuild test \
            -project WCS-GEO.xcodeproj \
            -scheme WCS-GEO \
            -sdk iphonesimulator \
            -destination "$DESTINATION" \
            -only-testing:WCS-GEOTests \
            CODE_SIGNING_ALLOWED=NO

  investor-report:
    name: Validate investor report assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify report images and PDF
        run: |
          set -euo pipefail
          for f in \
            docs/investor-report/images/report-01-gold-diamonds-vision.png \
            docs/investor-report/images/report-02-mobile-platform.png \
            docs/investor-report/images/report-03-ai-targeting.png \
            docs/investor-report/images/report-04-field-operations.png \
            docs/investor-report/images/report-05-investor-growth.png \
            docs/investor-report/WCS-Mining-AI-Investor-Report-10pp.pdf
          do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "All investor report assets present"

      - name: Verify App Store marketing assets
        run: |
          set -euo pipefail
          test -f docs/marketing/app-store/marketing-launch-iphone-hero.png
          test -f WCS-GEO/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          echo "Marketing and app icon assets present"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [build, unit-tests, investor-report]
    if: always()
    steps:
      - name: Require all jobs passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build job failed"
            exit 1
          fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.investor-report.result }}" != "success" ]]; then
            echo "Investor report validation failed"
            exit 1
          fi
          echo "All CI checks passed"
